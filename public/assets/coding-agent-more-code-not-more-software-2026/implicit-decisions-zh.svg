<svg viewBox="0 0 640 300" role="img" aria-label="implicit decisions" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:640px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><text x="10" y="26" font-size="16" font-weight="bold" fill="currentColor">提示没写的决定，agent 会替你定下</text><rect x="10" y="44" width="300" height="200" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="2"/><text x="160" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#f59e0b">提示里没回答的问题</text><text x="24" y="104" font-size="13" fill="currentColor">要不要保持向后兼容？</text><text x="24" y="136" font-size="13" fill="currentColor">延迟优先还是吞吐优先？</text><text x="24" y="168" font-size="13" fill="currentColor">高负载下能用多少内存？</text><text x="24" y="200" font-size="13" fill="currentColor">崩溃后丢通知能否接受？</text><text x="320" y="150" font-size="20" text-anchor="middle" fill="currentColor" fill-opacity="0.5">→</text><rect x="330" y="44" width="300" height="200" rx="10" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="2"/><text x="480" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#ef4444">Campfire Rust 重写的答案</text><text x="344" y="104" font-size="13" fill="currentColor">去掉 CSRF token 方便缓存</text><text x="344" y="136" font-size="13" fill="currentColor">Redis 换成进程内队列</text><text x="344" y="168" font-size="13" fill="currentColor">广播通道容量设为 256</text><text x="344" y="200" font-size="13" fill="currentColor">重压下通知送达约 1%</text><text x="10" y="276" font-size="12" fill="currentColor" fill-opacity="0.75">评审者要找的不是语法错误，而是这些没人拍板的默认值。</text></svg>