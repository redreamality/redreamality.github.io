<svg viewBox="0 0 640 300" role="img" aria-label="implicit decisions" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:640px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><text x="10" y="26" font-size="16" font-weight="bold" fill="currentColor">Unasked questions get answered by default</text><rect x="10" y="44" width="300" height="200" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="2"/><text x="160" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#f59e0b">Questions the prompt left open</text><text x="24" y="104" font-size="13" fill="currentColor">Keep backward compatibility?</text><text x="24" y="136" font-size="13" fill="currentColor">Latency or throughput first?</text><text x="24" y="168" font-size="13" fill="currentColor">Memory budget under load?</text><text x="24" y="200" font-size="13" fill="currentColor">Lose notifications on crash?</text><text x="320" y="150" font-size="20" text-anchor="middle" fill="currentColor" fill-opacity="0.5">→</text><rect x="330" y="44" width="300" height="200" rx="10" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="2"/><text x="480" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#ef4444">What the Rust rewrite chose</text><text x="344" y="104" font-size="13" fill="currentColor">Dropped the CSRF token</text><text x="344" y="136" font-size="13" fill="currentColor">Redis → in-process queues</text><text x="344" y="168" font-size="13" fill="currentColor">Broadcast capacity set to 256</text><text x="344" y="200" font-size="13" fill="currentColor">~1% delivery under heavy load</text><text x="10" y="276" font-size="12" fill="currentColor" fill-opacity="0.75">Reviewers hunt for defaults nobody signed off on, not syntax errors.</text></svg>