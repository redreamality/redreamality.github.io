<svg viewBox="0 0 600 300" role="img" aria-label="review bottleneck" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:600px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><text x="10" y="26" font-size="16" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Bottleneck moves upstream: write fast, review slow</text><rect x="10.0" y="60" width="105.0" height="70" rx="8" fill="#3b82f6" fill-opacity="0.0875" stroke="#3b82f6" stroke-width="2"/><text x="62.5" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">Prompt / spec</text><text x="121" y="95" font-size="16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.5">→</text><rect x="133.0" y="60" width="105.0" height="70" rx="8" fill="#3b82f6" fill-opacity="0.2375" stroke="#3b82f6" stroke-width="2"/><text x="185.5" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">Agent writes</text><text x="185.5" y="112" font-size="12" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.85">+30% LOC</text><text x="244" y="95" font-size="16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.5">→</text><rect x="256.0" y="60" width="105.0" height="70" rx="8" fill="#f59e0b" fill-opacity="0.175" stroke="#f59e0b" stroke-width="2"/><text x="308.5" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">Open PR</text><text x="367" y="95" font-size="16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.5">→</text><rect x="379.0" y="60" width="130.0" height="70" rx="8" fill="#ef4444" fill-opacity="0.2375" stroke="#ef4444" stroke-width="2"/><text x="444.0" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">Human review</text><text x="444.0" y="112" font-size="12" text-anchor="middle" font-weight="bold" fill="#ef4444" fill-opacity="1">+49% time</text><text x="515" y="95" font-size="16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.5">→</text><rect x="527.0" y="60" width="105.0" height="70" rx="8" fill="#10b981" fill-opacity="0.1125" stroke="#10b981" stroke-width="2"/><text x="579.5" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">Merge / ship</text><rect x="10.0" y="160" width="280.0" height="90" rx="8" fill="#3b82f6" fill-opacity="0.08"/><text x="24" y="186" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Write side widens</text><text x="24" y="208" font-size="13" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">LOC +30%, commits +20%,</text><text x="24" y="228" font-size="13" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">PRs +23%</text><rect x="310.0" y="160" width="280.0" height="90" rx="8" fill="#ef4444" fill-opacity="0.08"/><text x="324" y="186" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Review side lengthens</text><text x="324" y="208" font-size="13" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Review time +49%; comments +35%;</text><text x="324" y="228" font-size="13" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">change-requested PRs ≈ double</text><text x="10" y="278" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.75">AI review is common (~80% of firms), yet by Mar 2026 agents still leave ~23% of comments and ~11% of PRs; humans remain the main path.</text></svg>