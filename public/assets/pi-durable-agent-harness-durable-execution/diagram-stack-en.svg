<svg viewBox="0 0 740 460" role="img" aria-label="Durable execution stack comparison" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:740px;display:block;margin:0 auto;font-family:ui-sans-serif,system-ui,sans-serif;color:inherit">
  <text x="370" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Four layers: graph, harness, platform glue, general orchestration</text>
  <rect x="20" y="52" width="170" height="380" rx="10" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="105" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Graph / session</text>
  <text x="105" y="110" text-anchor="middle" font-size="12" fill="currentColor">LangGraph</text>
  <text x="105" y="128" text-anchor="middle" font-size="12" fill="currentColor">checkpointer</text>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">node snapshots</text>
  <text x="105" y="178" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">single-graph resume</text>
  <text x="105" y="210" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.75">weak: cross-service timers</text>
  <text x="105" y="228" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.75">weak: multiplayer</text>
  <rect x="200" y="52" width="170" height="380" rx="10" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="285" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Agent harness</text>
  <text x="285" y="110" text-anchor="middle" font-size="12" fill="currentColor">Pi Durable</text>
  <text x="285" y="128" text-anchor="middle" font-size="12" fill="currentColor">~15,000 LOC core</text>
  <text x="285" y="160" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">task checkpoints</text>
  <text x="285" y="178" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">forks / multi-convo</text>
  <text x="285" y="196" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">replay policy</text>
  <text x="285" y="214" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">documents</text>
  <text x="285" y="246" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.75">library, not a cluster</text>
  <rect x="380" y="52" width="170" height="380" rx="10" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="465" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Platform glue</text>
  <text x="465" y="110" text-anchor="middle" font-size="12" fill="currentColor">Cloudflare DO</text>
  <text x="465" y="128" text-anchor="middle" font-size="12" fill="currentColor">Vercel Queues</text>
  <text x="465" y="146" text-anchor="middle" font-size="12" fill="currentColor">Rivet Actor</text>
  <text x="465" y="178" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">hibernate / alarms</text>
  <text x="465" y="196" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">timeout takeover</text>
  <text x="465" y="214" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">one object per key</text>
  <rect x="560" y="52" width="160" height="380" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="640" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">General orchestration</text>
  <text x="640" y="110" text-anchor="middle" font-size="12" fill="currentColor">Temporal</text>
  <text x="640" y="128" text-anchor="middle" font-size="12" fill="currentColor">Restate / DBOS</text>
  <text x="640" y="146" text-anchor="middle" font-size="12" fill="currentColor">Inngest</text>
  <text x="640" y="164" text-anchor="middle" font-size="12" fill="currentColor">CF Workflows</text>
  <text x="640" y="196" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">workflow determinism</text>
  <text x="640" y="214" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">Activity / step</text>
  <text x="640" y="232" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">signals and long waits</text>
  <text x="640" y="264" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.75">you build agent semantics</text>
  <text x="370" y="450" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">Rightward: stronger cross-service orchestration. Leftward: closer to the model loop.</text>
</svg>