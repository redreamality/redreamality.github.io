<svg viewBox="0 0 700 480" role="img" aria-label="是否需要 durable harness 的决策" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:700px;display:block;margin:0 auto;font-family:ui-sans-serif,system-ui,sans-serif;color:inherit">
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">什么时候需要 durable harness</text>
  <rect x="220" y="52" width="260" height="56" rx="8" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="350" y="86" text-anchor="middle" font-size="13" fill="currentColor">进程死了，这轮还有没有价值？</text>
  <path d="M350 108 L350 128" stroke="currentColor" stroke-width="1.5"/>
  <rect x="40" y="132" width="280" height="70" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="180" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">没有：人会接着点</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">终端 coding agent 够用</text>
  <rect x="380" y="132" width="280" height="70" rx="8" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="520" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">有：无人值守 / 多表面</text>
  <text x="520" y="182" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">继续往下问</text>
  <path d="M520 202 L520 222" stroke="currentColor" stroke-width="1.5"/>
  <rect x="380" y="226" width="280" height="70" rx="8" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="520" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">有没有外部副作用？</text>
  <text x="520" y="276" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">扣款、部署、发帖、工单</text>
  <path d="M520 296 L520 316" stroke="currentColor" stroke-width="1.5"/>
  <rect x="200" y="320" width="220" height="64" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="310" y="348" text-anchor="middle" font-size="12" fill="currentColor">有 → 工具契约 + 幂等键</text>
  <text x="310" y="368" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">harness 不能单独兜底</text>
  <rect x="440" y="320" width="220" height="64" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="550" y="348" text-anchor="middle" font-size="12" fill="currentColor">无 → 检查点即可</text>
  <text x="550" y="368" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">safe 重放成本低</text>
  <rect x="80" y="410" width="540" height="52" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="350" y="432" text-anchor="middle" font-size="12" fill="currentColor">还要休眠、闹钟、函数超时接管？选平台粘合</text>
  <text x="350" y="450" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.8">DO / Vercel Queues / Rivet。跨服务长等待再上 Temporal 一类</text>
</svg>