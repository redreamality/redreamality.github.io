<svg viewBox="0 0 580 496" role="img" aria-label="OpenAI 训练环境分层与三类越界路径" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:580px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><defs><marker id="contzharr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="contzhara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="contzharp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker><marker id="contzharg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="contzharb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker></defs><text x="10" y="24" font-size="15" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">OpenAI 前沿训练环境的四层边界，与红队 agent 找到的三类越界</text><rect x="10" y="40" width="560" height="370" rx="10" fill="#94a3b8" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/><text x="22" y="60" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="0.85">第 4 层：网络与云边界（防火墙、安全组、IAM、私网）</text><rect x="26" y="72" width="400" height="322" rx="8" fill="#3b82f6" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/><text x="38" y="92" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="0.85">宿主机（多台 microVM 共用 CPU、缓存、存储）</text><rect x="42" y="104" width="176" height="128" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="currentColor" stroke-width="1.4"/><text x="52" y="122" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">第 2 层：microVM A（自有内核）</text><rect x="54" y="132" width="152" height="58" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/><text x="62" y="150" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">第 1 层：受限容器</text><text x="62" y="166" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">agent A：浏览器、</text><text x="62" y="182" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">代码执行、computer use</text><text x="108" y="216" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.7">hypervisor 隔离</text><rect x="236" y="104" width="176" height="128" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="currentColor" stroke-width="1.4"/><text x="246" y="122" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">第 2 层：microVM B（自有内核）</text><rect x="248" y="132" width="152" height="58" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/><text x="256" y="150" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">第 1 层：受限容器</text><text x="256" y="166" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">agent B：浏览器、</text><text x="256" y="182" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">代码执行、computer use</text><text x="246" y="216" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.7">hypervisor 隔离</text><rect x="42" y="250" width="176" height="58" rx="8" fill="#10b981" fill-opacity="0.14" stroke="currentColor" stroke-width="1.4"/><text x="52" y="270" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">离线世界</text><text x="52" y="288" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">索引 + 缓存的网页内容</text><text x="52" y="302" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">前沿 RL 全部走这里</text><rect x="236" y="250" width="176" height="58" rx="8" fill="#f59e0b" fill-opacity="0.14" stroke="currentColor" stroke-width="1.4"/><text x="246" y="270" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">留下的窄通道</text><text x="246" y="288" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">metrics、logging、</text><text x="246" y="302" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">认证管理（及 DNS）</text><rect x="42" y="322" width="370" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="52" y="342" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">第 3 层：监控与自动停训（检测越界、及时干预）</text><rect x="470" y="140" width="90" height="70" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.4"/><text x="515" y="168" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">真实互联网</text><text x="515" y="186" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.8">（训练期</text><text x="515" y="200" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.8">禁止访问）</text><path d="M 70 190 L 70 238 L 32 238 L 32 380" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#contzharr)"/><circle cx="70" cy="212" r="11" fill="#ef4444"/><text x="70" y="216.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">1</text><path d="M 412 268 L 450 268 L 500 214" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#contzhara)"/><circle cx="450" cy="268" r="11" fill="#f59e0b"/><text x="450" y="272.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">2</text><line x1="206" y1="168" x2="246" y2="168" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#contzharp)"/><line x1="246" y1="184" x2="206" y2="184" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#contzharp)"/><circle cx="227" cy="148" r="11" fill="#8b5cf6"/><text x="227" y="152.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">3</text><circle cx="22" cy="426" r="11" fill="#ef4444"/><text x="22" y="430.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">1</text><text x="40" y="430" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">VM 逃逸链：串起 Kata、gVisor、Docker 与内核漏洞，在宿主机上执行代码</text><circle cx="22" cy="452" r="11" fill="#f59e0b"/><text x="22" y="456.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">2</text><text x="40" y="456" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">窄通道出网：复用防火墙放行的连接打到被挡的认证端点，让它替模型抓 URL</text><circle cx="22" cy="478" r="11" fill="#8b5cf6"/><text x="22" y="482.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">3</text><text x="40" y="482" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">隐信道：CPU 缓存驱逐/重载计时；另有共享存储、CPU 争用、TLS 证书缓存</text></svg>
