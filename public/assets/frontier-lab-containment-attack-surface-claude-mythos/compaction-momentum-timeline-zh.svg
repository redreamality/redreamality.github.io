<svg viewBox="0 0 580 374" role="img" aria-label="compaction 惯性时间线" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:580px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><defs><marker id="compzharr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="compzhara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="compzharp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker><marker id="compzharg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="compzharb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker></defs><text x="10" y="24" font-size="15" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Mythos 5 的 9 个 compaction 周期：笔记如何把一次越界变成「已批准的路线」</text><rect x="22.0" y="44" width="116.0" height="22" rx="4" fill="#10b981" fill-opacity="0.85"/><text x="80.0" y="60" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">攻击前</text><rect x="142.0" y="44" width="56.0" height="22" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="170.0" y="60" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">开始攻击</text><rect x="202.0" y="44" width="356.0" height="22" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="380.0" y="60" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">中后期攻击</text><rect x="24.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="50.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期1</text><rect x="74.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="84.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="110.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期2</text><rect x="134.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="144.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="170.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期3</text><rect x="194.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="204.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="230.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期4</text><rect x="254.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="264.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="290.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期5</text><rect x="314.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="324.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="350.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期6</text><rect x="374.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="384.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="410.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期7</text><rect x="434.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="444.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="470.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期8</text><rect x="494.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="504.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="530.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">周期9</text><text x="20" y="126" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">紫色小块 = compaction：模型总结进度，并给下一周期的自己写操作笔记</text><rect x="10" y="140" width="168" height="108" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.4"/><text x="18" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">周期 1–2</text><text x="18" y="176" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">19 处谈到 GitHub 的 CoT，</text><text x="18" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">只有 1 处提到可能伤到真人</text><text x="18" y="210" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">模型越来越认定</text><text x="18" y="227" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">「正解在范围外」</text><rect x="186" y="140" width="184" height="108" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.4"/><text x="194" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">周期 3 开头</text><text x="194" y="176" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">从周期 3 的笔记重采样：</text><text x="194" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">87% 去 GitHub 找仓库</text><text x="194" y="210" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">69% 锁定同一个仓库</text><text x="194" y="227" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">3% 回到范围内</text><rect x="378" y="140" width="192" height="108" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.4"/><text x="386" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">周期 4–9</text><text x="386" y="176" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">每周期开头重采样：98% 继续</text><text x="386" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">中后期重采样：自停 2%</text><text x="386" y="210" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">插入「对方是真人」：停 5%</text><text x="386" y="227" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">笔记加中止条款：0% 中止</text><rect x="10" y="262" width="560" height="78" rx="8" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="20" y="282" font-size="11.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">干预实验：在周期 2 的 5 段 CoT 里补一句「这条路可能伤到真人」，让模型重写进入周期 3 的笔记</text><text x="20" y="306" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">原笔记</text><rect x="110" y="295" width="298.8" height="14" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="414.8" y="307" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">83% 去搜 GitHub</text><text x="20" y="328" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">改写后笔记</text><rect x="110" y="317" width="46.800000000000004" height="14" rx="3" fill="#10b981" fill-opacity="0.85"/><text x="162.8" y="329" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">13%</text><text x="10" y="360" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">周期 3 中段加入「若会碰到公开 GitHub 仓库就必须停」这类具体条款时，46% 的样本选择中止；周期 4 以后为 0。</text></svg>
