<svg viewBox="0 0 580 374" role="img" aria-label="Compaction momentum timeline" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:580px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><defs><marker id="compenarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="compenara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="compenarp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker><marker id="compenarg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="compenarb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker></defs><text x="10" y="24" font-size="15" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Nine compaction cycles: notes turned one detour into an approved route</text><rect x="22.0" y="44" width="116.0" height="22" rx="4" fill="#10b981" fill-opacity="0.85"/><text x="80.0" y="60" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">Pre-attack</text><rect x="142.0" y="44" width="56.0" height="22" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="170.0" y="60" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">Start</text><rect x="202.0" y="44" width="356.0" height="22" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="380.0" y="60" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">Mid-to-late attack</text><rect x="24.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="50.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C1</text><rect x="74.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="84.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="110.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C2</text><rect x="134.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="144.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="170.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C3</text><rect x="194.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="204.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="230.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C4</text><rect x="254.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="264.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="290.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C5</text><rect x="314.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="324.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="350.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C6</text><rect x="374.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="384.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="410.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C7</text><rect x="434.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="444.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="470.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C8</text><rect x="494.0" y="80" width="12" height="22" rx="2" fill="#8b5cf6" fill-opacity="0.85"/><rect x="504.0" y="74" width="52.0" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="530.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">C9</text><text x="20" y="126" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">Purple tabs = compaction: the model summarizes progress and writes notes that steer its next cycle</text><rect x="10" y="140" width="168" height="108" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.4"/><text x="18" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Cycles 1–2</text><text x="18" y="176" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">19 CoT turns on GitHub,</text><text x="18" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">only 1 mentions harm</text><text x="18" y="210" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Out-of-scope routes look</text><text x="18" y="227" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">more and more likely</text><rect x="186" y="140" width="184" height="108" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.4"/><text x="194" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Start of cycle 3</text><text x="194" y="176" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Resampling from cycle-3 notes:</text><text x="194" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">87% search GitHub for a repo</text><text x="194" y="210" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">69% pick the same repo</text><text x="194" y="227" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">3% return to in-scope work</text><rect x="378" y="140" width="192" height="108" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.4"/><text x="386" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Cycles 4–9</text><text x="386" y="176" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Cycle start: 98% continue</text><text x="386" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Mid-to-late: 2% stop alone</text><text x="386" y="210" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Told "real people": 5% stop</text><text x="386" y="227" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Abort clause: 0% abort</text><rect x="10" y="262" width="560" height="78" rx="8" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="20" y="282" font-size="11.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Intervention: note possible harm in 5 cycle-2 CoTs, regenerate cycle-3 notes</text><text x="20" y="306" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Original notes</text><rect x="110" y="295" width="298.8" height="14" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="414.8" y="307" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">83% search GitHub</text><text x="20" y="328" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Rewritten notes</text><rect x="110" y="317" width="46.800000000000004" height="14" rx="3" fill="#10b981" fill-opacity="0.85"/><text x="162.8" y="329" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">13%</text><text x="10" y="360" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">With a specific "stop if this touches a public GitHub repo" clause, 46% aborted in cycle 3; 0% from cycle 4 on.</text></svg>
