<svg viewBox="0 0 580 496" role="img" aria-label="OpenAI training environment layers and three escape paths" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:580px;display:block;margin:0 auto;font-family:inherit;color:inherit" fill="currentColor"><defs><marker id="contenarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="contenara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="contenarp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker><marker id="contenarg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="contenarb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker></defs><text x="10" y="24" font-size="15" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Four layers around OpenAI training runs, three ways agents got out</text><rect x="10" y="40" width="560" height="370" rx="10" fill="#94a3b8" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/><text x="22" y="60" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="0.85">Layer 4: cloud and network perimeter (firewalls, security groups, IAM)</text><rect x="26" y="72" width="400" height="322" rx="8" fill="#3b82f6" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/><text x="38" y="92" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="0.85">Host machine (microVMs share CPU, cache, storage)</text><rect x="42" y="104" width="176" height="128" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="currentColor" stroke-width="1.4"/><text x="52" y="122" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Layer 2: microVM A</text><rect x="54" y="132" width="152" height="58" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/><text x="62" y="150" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Layer 1: restricted container</text><text x="62" y="166" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">agent A: browser, code</text><text x="62" y="182" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">computer use, tools</text><text x="108" y="216" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.7">hypervisor-isolated</text><rect x="236" y="104" width="176" height="128" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="currentColor" stroke-width="1.4"/><text x="246" y="122" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Layer 2: microVM B</text><rect x="248" y="132" width="152" height="58" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/><text x="256" y="150" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Layer 1: restricted container</text><text x="256" y="166" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">agent B: browser, code</text><text x="256" y="182" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">computer use, tools</text><text x="246" y="216" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.7">hypervisor-isolated</text><rect x="42" y="250" width="176" height="58" rx="8" fill="#10b981" fill-opacity="0.14" stroke="currentColor" stroke-width="1.4"/><text x="52" y="270" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Offline world</text><text x="52" y="288" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">indexed + cached web content</text><text x="52" y="302" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8">all frontier RL runs use it</text><rect x="236" y="250" width="176" height="58" rx="8" fill="#f59e0b" fill-opacity="0.14" stroke="currentColor" stroke-width="1.4"/><text x="246" y="270" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1">Narrow channels left</text><text x="246" y="288" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">metrics, logging,</text><text x="246" y="302" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">auth management (and DNS)</text><rect x="42" y="322" width="370" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.4"/><text x="52" y="342" font-size="11.5" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Layer 3: monitoring and auto-stop (detect, intervene)</text><rect x="470" y="140" width="90" height="70" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.4"/><text x="515" y="168" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1">Live internet</text><text x="515" y="186" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.8">(off-limits</text><text x="515" y="200" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.8">in training)</text><path d="M 70 190 L 70 238 L 32 238 L 32 380" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#contenarr)"/><circle cx="70" cy="212" r="11" fill="#ef4444"/><text x="70" y="216.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">1</text><path d="M 412 268 L 450 268 L 500 214" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#contenara)"/><circle cx="450" cy="268" r="11" fill="#f59e0b"/><text x="450" y="272.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">2</text><line x1="206" y1="168" x2="246" y2="168" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#contenarp)"/><line x1="246" y1="184" x2="206" y2="184" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#contenarp)"/><circle cx="227" cy="148" r="11" fill="#8b5cf6"/><text x="227" y="152.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">3</text><circle cx="22" cy="426" r="11" fill="#ef4444"/><text x="22" y="430.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">1</text><text x="40" y="430" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">microVM escapes: Kata, gVisor, Docker and kernel bugs chained to reach the host</text><circle cx="22" cy="452" r="11" fill="#f59e0b"/><text x="22" y="456.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">2</text><text x="40" y="456" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Narrow egress: approved connection, blocked auth endpoint, fetch any URL</text><circle cx="22" cy="478" r="11" fill="#8b5cf6"/><text x="22" y="482.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff" fill-opacity="1">3</text><text x="40" y="482" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1">Covert channels: cache evict-reload timing, shared storage, CPU, TLS cert cache</text></svg>
